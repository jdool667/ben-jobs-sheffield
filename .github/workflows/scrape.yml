name: scrape-and-deploy
on:
  schedule:
    # 5x daily. GitHub cron is UTC, so UK local fires at 07/10/13/16/19 in
    # winter (GMT) and 08/11/14/17/20 in summer (BST). The site displays
    # the next run in Europe/London so the user always sees real local time.
    - cron: '0 7,10,13,16,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 indeed_scraper.py
      - run: python3 summarize.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - run: python3 build_site.py
        env:
          PAGES_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
      - name: commit cache + site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "scrape $(date -u +%F-%H%M)" && git push)
